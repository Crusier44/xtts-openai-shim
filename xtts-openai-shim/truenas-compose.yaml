# TrueNAS SCALE Custom App configuration for xtts-openai-shim
#
# Same deployment pattern as voice-metadata-app:
#   1. Push this repo to GitHub (public, or set up a registry credential
#      in TrueNAS if private -- see voice-metadata-app's notes on this).
#   2. Confirm GitHub Actions built and pushed the image to
#      ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME:latest
#   3. In TrueNAS: Apps -> Discover Apps -> Custom App -> Install via YAML,
#      paste this in (filling in your real username/repo), or configure
#      the equivalent fields by hand.
#   4. Confirm XTTS_BASE_URL below actually reaches your xtts-api-server
#      container -- use its TrueNAS-internal hostname if on the same
#      Docker network, otherwise the host IP + port (192.168.1.2:8020
#      matches what you've been using directly against Swagger).

services:
  xtts-openai-shim:
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME:latest
    container_name: xtts-openai-shim
    restart: unless-stopped

    ports:
      - "8021:8021"   # change host port (left side) if 8021 is taken

    environment:
      XTTS_BASE_URL: http://192.168.1.2:8020
      DEFAULT_LANGUAGE: en
      # DEFAULT_MODEL: Belldandy   # uncomment to auto-switch on startup

    # No GPU or volumes needed -- this shim only makes HTTP calls to your
    # existing xtts-api-server container, it does no inference itself.
